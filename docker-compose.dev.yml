name: wheredidishoot-dev

services:
  nginx:
    image: nginx:1.27-alpine
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    ports:
      - "${NGINX_DEV_PORT:-8081}:80"
    volumes:
      - ./nginx/conf.d/dev.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: dev
    command:
      - sh
      - -c
      - npm run generate:sdk && npm run dev
    environment:
      NODE_ENV: development
      NUXT_PUBLIC_API_BASE: ${NUXT_PUBLIC_API_BASE:-/api}
      NUXT_API_INTERNAL_BASE: http://backend:5000/api
      NUXT_HMR_CLIENT_PORT: ${NGINX_DEV_PORT:-8081}
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "300"
      NUXT_TELEMETRY_DISABLED: "1"
    volumes:
      - ./frontend:/app/frontend
      - ./backend/openapi.yml:/app/backend/openapi.yml:ro
      - frontend_node_modules:/app/frontend/node_modules
      - frontend_nuxt:/app/frontend/.nuxt
      - frontend_output:/app/frontend/.output
    expose:
      - "3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000').then((res)=>process.exit(res.ok?0:1)).catch(()=>process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      target: dev
    command:
      - flask
      - run
      - --debug
      - --host=0.0.0.0
      - --port=5000
    environment:
      FLASK_APP: wsgi:app
      FLASK_DEBUG: "1"
      FLASK_SECRET_KEY: ${FLASK_SECRET_KEY:-change-me}
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${MARIADB_DATABASE:-app}
      DB_USER: ${MARIADB_USER:-app}
      DB_PASSWORD: ${MARIADB_PASSWORD:-app_password}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
    expose:
      - "5000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen("http://127.0.0.1:5000/api/health")
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  db:
    image: mariadb:11
    environment:
      MARIADB_DATABASE: ${MARIADB_DATABASE:-app}
      MARIADB_USER: ${MARIADB_USER:-app}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:-app_password}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-root_password}
    volumes:
      - db_dev_data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - mariadb-admin ping -h 127.0.0.1 -u$$MARIADB_USER -p$$MARIADB_PASSWORD --silent
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

volumes:
  db_dev_data:
  frontend_node_modules:
  frontend_nuxt:
  frontend_output:
